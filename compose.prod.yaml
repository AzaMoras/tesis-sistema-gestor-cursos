name: aula-verde-production
x-logging: &production-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
services:
  app:
    image: aula-verde-app:${AULA_RELEASE:-local}
    build:
      context: .
      target: production
    user: "33:33"
    env_file: .docker/production/app-mariadb.env
    environment:
      AULA_PRODUCTION: "1"
      AULA_DOMAIN: ${AULA_DOMAIN:-aula.invalid}
    volumes:
      - storage:/var/www/html/storage
    networks: [web, database]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *production-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 9000); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    image: aula-verde-nginx:${AULA_RELEASE:-local}
    build:
      context: .
      target: nginx
    user: "101:101"
    ports: ["80:8080", "443:8443"]
    volumes:
      - type: bind
        source: ./.docker/production/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - ./certs:/etc/nginx/certs:ro
      - ./.docker/production/acme:/var/www/acme:ro
    networks: [web]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *production-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  db:
    image: mariadb:11.8.9-noble
    user: "mysql"
    env_file: .docker/production/db-mariadb.env
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_nopad_bin']
    environment:
      MARIADB_ROOT_HOST: localhost
    volumes:
      - mariadb:/var/lib/mysql
    networks: [database]
    restart: unless-stopped
    logging: *production-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  web:
  database:
    internal: true
volumes:
  storage:
  mariadb:
