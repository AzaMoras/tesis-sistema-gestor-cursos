server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;

log_format aula_production '$remote_addr [$time_local] "$request_method $uri" '
                           '$status $body_bytes_sent $request_time';
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080 default_server;
    server_name _;
    access_log /dev/stdout aula_production;
    return 421;
}

server {
    listen 8080;
    server_name aula.invalid;
    access_log /dev/stdout aula_production;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://$server_name$request_uri; }
}

server {
    listen 8443 ssl default_server;
    server_name _;
    access_log /dev/stdout aula_production;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 8443 ssl;
    server_name aula.invalid;
    access_log /dev/stdout aula_production;
    ssl_certificate /etc/nginx/certs/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/privkey.pem;
    ssl_session_cache shared:TLS:10m;
    root /var/www/html/public;
    client_max_body_size 22m;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_HOST $server_name;
        fastcgi_param HTTP_PROXY "";
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_hide_header X-Powered-By;
    }
    location ~* \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}

server {
    listen 127.0.0.1:8081;
    server_name _;
    root /var/www/html/public;
    access_log off;

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
    }
    location / { return 404; }
}
